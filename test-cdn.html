<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zero-Code Drop-in Test</title>
  <style>
    body { margin: 0; background: #040816; font-family: sans-serif; color: #fff; padding: 40px; }
    .hero {
      width: 100%;
      height: 400px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2a42f7 0%, #0a1128 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .hero .content {
      position: relative;
      z-index: 2;
    }
  </style>
  <!-- 1 SINGLE SCRIPT TAG TO LOAD EVERYTHING -->
  <script src="./synaptic-net.min.js"></script>
</head>
<body>

  <!-- Just add data-synaptic-bg -->
  <section class="hero" data-synaptic-bg="ripple-net">
    <div class="content">
      <h1>Zero-Config Drop-in Background</h1>
      <p>Loaded purely by adding data-synaptic-bg="ripple-net"!</p>
    </div>
  </section>

</body>
</html>
